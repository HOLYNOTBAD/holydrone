camera:
  # Shared by real flight and simulation.
  video_resource: 0  # /dev/video0
  img_width: 2592
  img_height: 1944
  camera_model: "pinhole"
  distortion_model: "equidistant"
  framerate: 30
  pixel_format: "MJPG"

  # Selected Kalibr pinhole-equidistant calibration at 2592x1944
  # (camera_intrinsics_20260930_104925).
  fx: 1441.852622821482
  fy: 1445.9274327770395
  cx: 1308.7786795660375
  cy: 944.4195184780068
  img_f: 1443.8900277992607  # Backward-compatible average of fx and fy
  distortion_coeffs: [0.3035916397432048, 0.15780095426374802, -0.0872034887822387, -0.00545093289933308]  # equidistant: k1, k2, k3, k4

  # Selected Kalibr camera RDF -> body/IMU FLU extrinsics
  # (camera_imu_extrinsics_20261003_154906; IMX577-1 and current IMU).
  # Camera optical-center position expressed in body/IMU FLU [m].
  position_body_m: [0.135780849490659, -0.003395501081817871, 0.03675079970930442]
  R_cam_body: [-0.036469756177187715, 0.48944620991644244, 0.8712705460893337, -0.9991267034273943, -6.852651256082302e-05, -0.04178308033671335, -0.020390865177418116, -0.8720334872598337, 0.48902127736405243]
  p_B_C: [0.135780849490659, -0.003395501081817871, 0.03675079970930442] # Camera optical center in body/IMU FLU [m].
  q_B_C: [0.6025950121504292, -0.3444479252990648, 0.36992565209125955, -0.6175677209937792] # Camera RDF -> body/IMU FLU [w x y z].
  img_distance: 20
  time_offset: -0.026892977019340666 # t_imu = t_cam + time_offset [s]

  # Optional Gazebo model overrides. Empty values use the project defaults.
  gazebo:
    aircraft_sdf: ""
    fpv_cam_sdf: ""

  usb_cam_driver:
    # Stable UVC capture link; unlike /dev/video0 it does not change when
    # devices are re-enumerated. index0 is video capture, index1 is metadata.
    video_device: "/dev/v4l/by-id/usb-HD_USB_Camera_HD_USB_Camera_01.00.00-video-index0"
    image_width: 2592
    image_height: 1944
    framerate: 30
    pixel_format: "mjpeg"
    io_method: "mmap"
    camera_name: "camera"
    camera_frame_id: "camera"
    output_topic: "image_raw"
    # V4L2 MJPEG bytes published without decode/re-encode for low-bandwidth recording.
    compressed_output_topic: "image_raw/mjpeg"
    worker_threads: 3
    capture_buffers: 6
    capture_queue_size: 6
    decoded_queue_size: 3
    fast_upsample: true
    rotation_angle: 180  # Clockwise: 0, 90, 180 or 270 degrees
    statistics_period: 5.0

Debug:
  is_show_image: true
  is_show_rgb: false
  is_show_hsv: false
  is_show_bbx: false
  det_conf_threshold: 0.40
  is_show_3D_estimation: true
