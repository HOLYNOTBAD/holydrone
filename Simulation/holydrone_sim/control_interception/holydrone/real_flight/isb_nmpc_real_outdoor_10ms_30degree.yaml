# Bridge/runtime parameters
control_rate: 50.0
hover_thrust: 0.30
hover_acceleration: 10.0

# Cost on states
Q_velocity: 500
Q_speed: 20
Q_perception_u: 1000
Q_perception_v: 500
Q_image_rate_u: 600
Q_image_rate_v: 600
Q_image_rate_z: 600
Q_terminal_line: 300
Q_terminal_vis_u: 20
Q_terminal_vis_v: 20

# Cost on inputs
R_thrust: 3.0
R_roll: 45
R_pitch: 25
R_yaw: 20
R_speed_delta: 40
R_slack_u: 300
R_slack_v: 1000

state_cost_exponential: 0.0
input_cost_exponential: 0.0
max_invalid_retries: 5
max_zero_control_retries: 5

# Limits for inputs
max_bodyrate_x: 3.0
max_bodyrate_y: 3.0
max_bodyrate_z: 1.2
min_thrust: 0.0
max_thrust: 50.0

# Interception speed state
min_intercept_speed: 1.0
intercept_speed: 9.5
los_speed_schedule_kh: 3.0
los_speed_schedule_kv: 4.0  # vertical scheduling gain; may be tuned independently from kh
max_initial_intercept_speed: 4.0
max_delta_intercept_speed: 2.5
min_solver_range: 1.0
nominal_target_range: 6.0

# Image-plane bounds for normalized projection residual and FOV constraints.
align_los_theta_to_image_bounds: true
image_bound_margin: 0.3
los_theta_max: 0.461799

print_info: true
