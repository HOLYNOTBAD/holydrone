# Provisional 0-degree Holydrone ISB-NMPC SIMULATION profile: 20 m/s, standard.
# Parameter values mirror the corresponding 30-degree profile; the 0-degree camera
# pose is supplied separately by camera_params_usb_imx577-2_0degree.yaml.
# Not closed-loop validated at 0 degrees. Do not use for real flight.
control_rate: 50.0
target_dropout_hold_sec: 0.15
hover_thrust: 0.30
hover_acceleration: 10.0

# Cost on states
Q_velocity: 550  # Cost for velocity error
Q_speed: 55      # Cost for optimized closing speed to approach intercept_speed
Q_perception_u: 1800  # Cost for normalized horizontal image-plane residual
Q_perception_v: 900  # Cost for normalized vertical image-plane residual
Q_image_rate_u: 1200  # Cost for spherical bearing jitter about camera y
Q_image_rate_v: 1000 # Cost for spherical bearing jitter about camera x
Q_image_rate_z: 1000 # Cost for spherical bearing jitter about camera z
Q_terminal_line: 400  # Terminal cost for distance to current UAV-target line
Q_terminal_vis_u: 25
Q_terminal_vis_v: 25

# Cost on inputs
R_thrust: 4.0  # Cost on thrust input
R_roll: 75  # Cost on body-rate x
R_pitch: 60  # Cost on body-rate y
R_yaw: 120  # Cost on yaw rate
R_speed_delta: 65  # Cost on closing-speed rate ds
R_slack_u: 1500  # Cost on horizontal FOV slack sv1
R_slack_v: 2000  # Cost on vertical FOV slack sv2

# Exponential scaling: W_i = W * exp(-i/N * cost_scaling).
# cost_scaling = 0 means no scaling W_i = W.
state_cost_exponential: 0.0  # No exponential scaling for state costs
input_cost_exponential: 0.0  # No exponential scaling for input costs
max_invalid_retries: 5  # Reuse last valid SO3 command this many invalid ticks.
max_zero_control_retries: 5  # Then publish zero body-rate recovery commands before attitude hover.

# Limits for inputs
max_bodyrate_x: 1.1  # roll-rate limit [rad/s]
max_bodyrate_y: 1.4  # pitch-rate limit [rad/s]
max_bodyrate_z: 0.5  # yaw-rate limit [rad/s]
max_roll_angle_deg: 50.0
min_thrust: 0.0  # collective mass-normalized thrust lower bound [m/s^2]
max_thrust: 50.0  # collective mass-normalized thrust upper bound [m/s^2]

# Extrinsics for perception-aware terms

# Interception speed state
min_intercept_speed: 0.8  # desired closing speed when horizontal LOS error is large [m/s]
intercept_speed: 20.0  # max desired relative closing speed near centered LOS [m/s]
los_speed_schedule_kh: 6.0  # larger values reduce closing speed faster as horizontal LOS error grows
los_speed_schedule_kv: 8.0
max_initial_intercept_speed: 3.0  # clamp inherited closing speed when entering EXEC_INTERCEPTION [m/s]
max_delta_intercept_speed: 1.3  # max rate of optimized closing-speed state ds [m/s^2]
min_solver_range: 1.0  # lower bound for range state used inside NMPC [m]
nominal_target_range: 16.0  # range used in bearing-only mode when target position is unavailable [m]

# Image-plane bounds for normalized projection residual and FOV constraints.
align_los_theta_to_image_bounds: true  # compute los_theta_max from /camera/img_height and /camera/img_f
image_bound_margin: 0.35  # same normalized image-plane margin as the NMPC FOV constraint
los_theta_max: 0.461799  # manual fallback when align_los_theta_to_image_bounds is false [rad]

# Print information such as timing to terminal
print_info: true
